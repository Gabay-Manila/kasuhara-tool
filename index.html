<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>介護現場用 カスハラ判定・記録支援 / Customer Harassment Assessment Tool</title>
<style>
  :root {
    --bg-color: #f4f6f8;
    --card-bg: #ffffff;
    --text-color: #2c3e50;
    --border-color: #dcdde1;
    --alert-blue: #2980b9;
    --alert-yellow: #d35400;
    --alert-red: #c0392b;
    --alert-green: #27ae60;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    padding: 16px;
    line-height: 1.5;
  }
  .container { max-width: 680px; margin: 0 auto; }
  .card {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  h1 { font-size: 1.15rem; text-align: center; margin-bottom: 12px; }
  h2 { font-size: 1rem; margin-bottom: 10px; border-bottom: 2px solid var(--border-color); padding-bottom: 4px; }

  /* Language toggle */
  .lang-toggle {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .lang-btn {
    flex: 0 0 auto;
    min-width: 96px;
    padding: 8px 14px;
    font-size: 0.85rem;
    font-weight: bold;
    border: 1px solid var(--border-color);
    border-radius: 20px;
    background: #fff;
    color: var(--text-color);
    cursor: pointer;
  }
  .lang-btn.active {
    background: #2c3e50;
    color: #fff;
    border-color: #2c3e50;
  }

  /* Status Box */
  .status-box {
    text-align: center;
    padding: 14px;
    border-radius: 8px;
    font-weight: bold;
    font-size: 1.05rem;
    margin-bottom: 16px;
    transition: all 0.3s ease;
    background-color: var(--alert-green);
    color: #fff;
  }
  .guide-box {
    background-color: #f8f9fa;
    border-left: 5px solid var(--alert-green);
    padding: 10px 12px;
    font-size: 0.9rem;
    margin-bottom: 16px;
    border-radius: 0 8px 8px 0;
  }

  /* Checklist Styles */
  .section-label {
    font-weight: bold;
    margin-top: 12px;
    font-size: 0.86rem;
    padding: 4px 8px;
    border-radius: 4px;
    display: inline-block;
  }
  .label-red { background-color: #fceae8; color: var(--alert-red); }
  .label-yellow { background-color: #fdf2e9; color: var(--alert-yellow); }
  .label-blue { background-color: #eaf2f8; color: var(--alert-blue); }

  .check-item {
    display: flex;
    align-items: flex-start;
    padding: 10px 0;
    border-bottom: 1px solid #eee;
    cursor: pointer;
    font-size: 0.92rem;
  }
  .check-item:last-child { border-bottom: none; }
  .check-item input {
    margin-top: 3px;
    margin-right: 12px;
    width: 20px;
    height: 20px;
    flex-shrink: 0;
  }

  /* Form Elements */
  .form-group { margin-bottom: 12px; }
  label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 4px; }
  input[type="text"], input[type="datetime-local"], select, textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    font-size: 0.95rem;
    background: #fff;
  }
  textarea { resize: vertical; min-height: 80px; }

  /* Actions */
  .btn-group { display: flex; gap: 8px; margin-top: 12px; }
  button {
    flex: 1;
    padding: 12px;
    font-size: 0.95rem;
    font-weight: bold;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  button:active { opacity: 0.8; }
  .btn-primary { background: #2c3e50; color: #fff; }
  .btn-secondary { background: #95a5a6; color: #fff; }

  .file-list {
    margin-top: 6px;
    font-size: 0.82rem;
  }
  .file-list-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 10px;
    background: #f8f9fa;
    border-radius: 6px;
    margin-bottom: 4px;
  }
  .file-list-item button {
    flex: 0 0 auto;
    padding: 2px 8px;
    font-size: 0.78rem;
    background: #e0e0e0;
    color: #2c3e50;
    border-radius: 4px;
  }
  .hint-text {
    font-size: 0.78rem;
    color: #7f8c8d;
    margin-top: 4px;
  }

  .output-area {
    white-space: pre-wrap;
    background: #fdfdfd;
    border: 1px dashed #bdc3c7;
    border-radius: 6px;
    padding: 12px;
    font-size: 0.85rem;
    margin-top: 12px;
    font-family: monospace;
  }
</style>
</head>
<body>

<div class="container">

  <div class="lang-toggle" role="group" aria-label="Language / 言語">
    <button type="button" class="lang-btn" id="langBtnJa" onclick="setLanguage('ja')">日本語</button>
    <button type="button" class="lang-btn" id="langBtnEn" onclick="setLanguage('en')">English</button>
  </div>

  <div class="card">
    <h1 id="pageTitle"></h1>
    <div id="statusBadge" class="status-box"></div>
    <div id="actionGuide" class="guide-box"></div>
  </div>

  <!-- Checklist Section -->
  <div class="card">
    <h2 id="checklistTitle"></h2>

    <div class="section-label label-red" id="labelRed"></div>
    <div id="groupRed"></div>

    <div class="section-label label-yellow" id="labelYellow"></div>
    <div id="groupYellow"></div>

    <div class="section-label label-blue" id="labelBlue"></div>
    <div id="groupBlue"></div>
  </div>

  <!-- Incident Details Form -->
  <div class="card">
    <h2 id="formTitle"></h2>

    <div class="form-group">
      <label id="labelTime" for="incidentTime"></label>
      <input type="datetime-local" id="incidentTime">
    </div>

    <div class="form-group">
      <label id="labelLocation" for="location"></label>
      <select id="location"></select>
    </div>

    <div class="form-group">
      <label id="labelTarget" for="targetPerson"></label>
      <input type="text" id="targetPerson">
    </div>

    <div class="form-group">
      <label id="labelStaff" for="staffNames"></label>
      <input type="text" id="staffNames">
    </div>

    <div class="form-group">
      <label id="labelDetails" for="details"></label>
      <textarea id="details"></textarea>
    </div>

    <div class="form-group">
      <label id="labelEvidence" for="evidence"></label>
      <input type="text" id="evidence">
    </div>

    <div class="form-group">
      <label id="labelEvidenceFiles" for="evidenceFiles"></label>
      <input type="file" id="evidenceFiles" accept="image/*,audio/*,video/*" multiple>
      <div id="evidenceFilesList" class="file-list"></div>
      <p id="evidenceFilesHint" class="hint-text"></p>
    </div>

    <div class="btn-group">
      <button class="btn-primary" id="btnGenerate" onclick="generateReport()"></button>
      <button class="btn-secondary" id="btnReset" onclick="resetForm()"></button>
    </div>

    <div id="outputContainer" style="display:none; margin-top:16px;">
      <label id="labelOutput"></label>
      <div id="output" class="output-area"></div>
      <div class="btn-group" style="margin-top:8px;">
        <button class="btn-primary" id="btnCopy" onclick="copyToClipboard()"></button>
        <button class="btn-primary" id="btnShare" onclick="shareReport()" style="display:none;"></button>
      </div>
      <p id="shareUnsupportedNote" class="hint-text" style="display:none;"></p>
    </div>
  </div>
</div>

<script>
  // ---------------------------------------------------------------
  // Data: checklist items (id, alert level, ja/en text)
  // ---------------------------------------------------------------
  const CHECK_ITEMS = [
    { id: 'red1',    alert: 'red',    ja: '暴力（叩く・蹴る・胸ぐらを掴む・物を投げる等）',            en: 'Violence (hitting, kicking, grabbing collar, throwing objects, etc.)' },
    { id: 'red2',    alert: 'red',    ja: '脅迫・威嚇（「殺す」「施設を潰す」等の発言）',                en: 'Threats / intimidation (e.g. "I\u2019ll kill you," "I\u2019ll shut this place down")' },

    { id: 'yellow2', alert: 'yellow', ja: '土下座や契約外サービスの強要',                                en: 'Forcing a dogeza apology or services outside the contract' },

    { id: 'blue1',   alert: 'blue',   ja: '20分以上の執拗な拘束・同一主張の反復',                        en: 'Persistent restraint for 20+ minutes / repeating the same demand' },

    { id: 'blue3',   alert: 'blue',   ja: '連続電話による通常業務の妨害',                                en: 'Obstructing normal operations with repeated phone calls' }

  const LOCATIONS = [
    { ja: '施設内（フロア・居室）',   en: 'On-site (floor / resident room)' },

      badge: {

      }
    },
    en: {
      htmlLang: 'en',
      pageTitle: 'Customer Harassment Assessment & Reporting Tool (Care Settings)',
      checklistTitle: '1. Objective Fact Checklist',
      formTitle: '2. Incident Record (5W1H)',
      labelRed: '\u25a0 RED (Danger / Criminal act): Evacuate immediately, call police',
      labelYellow: '\u25a0 YELLOW (Malicious / Excessive demand): Refuse and end response immediately',
      labelBlue: '\u25a0 BLUE (Restraint / Business obstruction): Respond in pairs, set a time limit',
      labelTime: 'Date & Time of Incident',
      labelLocation: 'Location',

      staffPlaceholder: 'e.g. Care worker Sato (present: Manager Suzuki)',

      evidencePlaceholder: 'e.g. Call recording preserved, security camera footage, photos of damage',
      labelEvidenceFiles: 'Select evidence files (photo / audio / video)',
      evidenceFilesHint: 'Choose photos, recordings, or video already saved on this device. Files chosen here are not stored or sent anywhere until you tap "Share with evidence attached."',

      btnGenerate: 'Generate Report Text',
      btnReset: 'Reset',
      labelOutput: 'Generated Report Format (for copying)',

      copyFail: 'Copy failed.',
      shareFail: 'Sharing failed. Please use Copy to Clipboard instead.',
      shareUnsupportedNote: 'This browser cannot share evidence files. Use "Copy to Clipboard" above for the report text, and attach photos or recordings separately by hand.',

        green: 'Status: GREEN (Normal response)',
        red: 'Status: RED [Report immediately / Evacuate now]',

      },

        red: '<strong>[Emergency Evacuation / Reporting Steps]</strong><br>1. Prioritize staff safety and withdraw from the scene immediately.<br>2. Call the police (<strong>110</strong>) without hesitation.<br>3. Preserve security camera footage / recordings as evidence and contact the manager and lawyer.',

      },

        target: '\u25a0 Other Party',
        staff: '\u25a0 Staff Involved',

  let currentLang = 'ja';
  const checkedState = {}; // id -> boolean
  let evidenceFiles = []; // File objects selected by the user, in-memory only

  function t() { return I18N[currentLang]; }

  // ---------------------------------------------------------------
  // Rendering
  // ---------------------------------------------------------------
  function renderChecklistGroup(containerId, alertType) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    CHECK_ITEMS.filter(item => item.alert === alertType).forEach(item => {
      const label = document.createElement('label');
      label.className = 'check-item';

      const input = document.createElement('input');
      input.type = 'checkbox';
      input.className = 'chk';
      input.dataset.id = item.id;
      input.dataset.alert = item.alert;
      input.checked = !!checkedState[item.id];
      input.addEventListener('change', () => {
        checkedState[item.id] = input.checked;
        evaluateAlertLevel();
      });

      const span = document.createElement('span');
      span.textContent = item[currentLang];

      label.appendChild(input);
      label.appendChild(span);
      container.appendChild(label);
    });
  }

  function renderStaticText() {
    const s = t();
    document.documentElement.lang = s.htmlLang;
    document.title = s.pageTitle;
    document.getElementById('pageTitle').textContent = s.pageTitle;
    document.getElementById('checklistTitle').textContent = s.checklistTitle;
    document.getElementById('formTitle').textContent = s.formTitle;
    document.getElementById('labelRed').textContent = s.labelRed;
    document.getElementById('labelYellow').textContent = s.labelYellow;
    document.getElementById('labelBlue').textContent = s.labelBlue;

    document.getElementById('labelTime').textContent = s.labelTime;
    document.getElementById('labelLocation').textContent = s.labelLocation;
    document.getElementById('labelTarget').textContent = s.labelTarget;
    document.getElementById('targetPerson').placeholder = s.targetPlaceholder;
    document.getElementById('labelStaff').textContent = s.labelStaff;
    document.getElementById('staffNames').placeholder = s.staffPlaceholder;
    document.getElementById('labelDetails').textContent = s.labelDetails;
    document.getElementById('details').placeholder = s.detailsPlaceholder;
    document.getElementById('labelEvidence').textContent = s.labelEvidence;
    document.getElementById('evidence').placeholder = s.evidencePlaceholder;
    document.getElementById('labelEvidenceFiles').textContent = s.labelEvidenceFiles;
    document.getElementById('evidenceFilesHint').textContent = s.evidenceFilesHint;

    document.getElementById('btnGenerate').textContent = s.btnGenerate;
    document.getElementById('btnReset').textContent = s.btnReset;
    document.getElementById('labelOutput').textContent = s.labelOutput;
    document.getElementById('btnCopy').textContent = s.btnCopy;
    document.getElementById('btnShare').textContent = s.btnShare;
    document.getElementById('shareUnsupportedNote').textContent = s.shareUnsupportedNote;
    renderEvidenceFileList();

    // location select — preserve selected index across languages
    const locationSelect = document.getElementById('location');
    const prevIndex = locationSelect.selectedIndex >= 0 ? locationSelect.selectedIndex : 0;
    locationSelect.innerHTML = '';
    LOCATIONS.forEach(loc => {
      const opt = document.createElement('option');
      opt.value = loc[currentLang];
      opt.textContent = loc[currentLang];
      locationSelect.appendChild(opt);
    });
    locationSelect.selectedIndex = prevIndex;

    document.getElementById('langBtnJa').classList.toggle('active', currentLang === 'ja');
    document.getElementById('langBtnEn').classList.toggle('active', currentLang === 'en');
  }

  function setLanguage(lang) {
    currentLang = lang;
    renderStaticText();
    renderChecklistGroup('groupRed', 'red');
    renderChecklistGroup('groupYellow', 'yellow');
    renderChecklistGroup('groupBlue', 'blue');
    evaluateAlertLevel();
  }

  // ---------------------------------------------------------------
  // Alert level logic
  // ---------------------------------------------------------------
  function evaluateAlertLevel() {
    let alertType = 'green';

    // 優先度判定: red > yellow > blue
    CHECK_ITEMS.forEach(item => {
      if (checkedState[item.id]) {
        if (item.alert === 'red') {
          alertType = 'red';
        } else if (item.alert === 'yellow' && alertType !== 'red') {
          alertType = 'yellow';
        } else if (item.alert === 'blue' && alertType !== 'red' && alertType !== 'yellow') {
          alertType = 'blue';
        }
      }
    });

    const s = t();
    const badge = document.getElementById('statusBadge');
    const guide = document.getElementById('actionGuide');
    const colorVar = {
      red: 'var(--alert-red)',
      yellow: 'var(--alert-yellow)',
      blue: 'var(--alert-blue)',
      green: 'var(--alert-green)'
    }[alertType];

    badge.textContent = s.badge[alertType];
    badge.style.backgroundColor = colorVar;
    guide.style.borderLeftColor = colorVar;
    guide.innerHTML = s.guide[alertType];
  }

  // ---------------------------------------------------------------
  // Report generation
  // ---------------------------------------------------------------
  function generateReport() {
    const s = t();
    const timeVal = document.getElementById('incidentTime').value;
    const locationVal = document.getElementById('location').value;
    const targetVal = document.getElementById('targetPerson').value || s.report.unfilled;
    const staffVal = document.getElementById('staffNames').value || s.report.unfilled;
    const detailsVal = document.getElementById('details').value || s.report.unfilled;
    const evidenceVal = document.getElementById('evidence').value || s.report.evidenceNone;

    const selectedRisks = CHECK_ITEMS
      .filter(item => checkedState[item.id])
      .map(item => `\u30fb${s.reportPrefix[item.alert]} ${item[currentLang]}`);

    const badgeText = document.getElementById('statusBadge').textContent;

    const reportText =
`${s.report.title}
${s.report.divider}
${s.report.judgement}: ${badgeText}
${s.report.items}:
${selectedRisks.length > 0 ? selectedRisks.join('\n') : s.report.none}

${s.report.time}: ${timeVal.replace('T', ' ')}
${s.report.location}: ${locationVal}
${s.report.target}: ${targetVal}
${s.report.staff}: ${staffVal}

${s.report.details}:
${detailsVal}

${s.report.evidence}:
${evidenceVal}
${s.report.divider}
${s.report.generatedAt}: ${new Date().toLocaleString(currentLang === 'ja' ? 'ja-JP' : 'en-US')}`;

    document.getElementById('output').textContent = reportText;
    document.getElementById('outputContainer').style.display = 'block';
  }

  function copyToClipboard() {
    const s = t();
    const text = document.getElementById('output').textContent;
    navigator.clipboard.writeText(text).then(() => {
      alert(s.copySuccess);
    }).catch(err => {
      alert(s.copyFail);
    });
  }

  // ---------------------------------------------------------------
  // Evidence files (photo / audio / video) — in-memory only,
  // handed to the OS share sheet together with the report text.
  // ---------------------------------------------------------------
  function renderEvidenceFileList() {
    const s = t();
    const list = document.getElementById('evidenceFilesList');
    list.innerHTML = '';
    evidenceFiles.forEach((file, index) => {
      const row = document.createElement('div');
      row.className = 'file-list-item';

      const name = document.createElement('span');
      name.textContent = file.name;

      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.textContent = s.removeFile;
      removeBtn.addEventListener('click', () => {
        evidenceFiles.splice(index, 1);
        renderEvidenceFileList();
      });

      row.appendChild(name);
      row.appendChild(removeBtn);
      list.appendChild(row);
    });
  }

  async function shareReport() {
    const s = t();
    const text = document.getElementById('output').textContent;
    try {
      const shareData = { text };
      if (evidenceFiles.length > 0 && navigator.canShare && navigator.canShare({ files: evidenceFiles })) {
        shareData.files = evidenceFiles;
      }
      await navigator.share(shareData);
    } catch (err) {
      if (err && err.name === 'AbortError') return; // user cancelled the share sheet
      alert(s.shareFail);
    }
  }

  function updateShareButtonVisibility() {
    const shareSupported = !!navigator.share;
    document.getElementById('btnShare').style.display = shareSupported ? 'block' : 'none';
    document.getElementById('shareUnsupportedNote').style.display = shareSupported ? 'none' : 'block';
  }

  function resetForm() {
    Object.keys(checkedState).forEach(id => { checkedState[id] = false; });
    renderChecklistGroup('groupRed', 'red');
    renderChecklistGroup('groupYellow', 'yellow');
    renderChecklistGroup('groupBlue', 'blue');
    evaluateAlertLevel();
    document.getElementById('targetPerson').value = '';
    document.getElementById('staffNames').value = '';
    document.getElementById('details').value = '';
    document.getElementById('evidence').value = '';
    document.getElementById('evidenceFiles').value = '';
    evidenceFiles = [];
    renderEvidenceFileList();
    document.getElementById('outputContainer').style.display = 'none';
  }

  // ---------------------------------------------------------------
  // Init
  // ---------------------------------------------------------------
  window.onload = function() {
    const now = new Date();
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    document.getElementById('incidentTime').value = now.toISOString().slice(0, 16);

    document.getElementById('evidenceFiles').addEventListener('change', (e) => {
      evidenceFiles = evidenceFiles.concat(Array.from(e.target.files));
      e.target.value = ''; // allow re-selecting the same file later
      renderEvidenceFileList();
    });

    updateShareButtonVisibility();
    setLanguage('ja');
  };
</script>

</body>
</html>
